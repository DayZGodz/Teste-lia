<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LR PAINEL DE EFEITOS</title>
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background: transparent;
            color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        .hidden { display: none !important; }
        #container { 
            position: fixed; 
            bottom: 25px;   /* embaixo */
            left: 25px;     /* esquerda */
            top: auto !important;  /* mata o top */
            width: auto; 
            min-width: 200px; 
            max-width: 300px; 
        }
        .panel {
            background: linear-gradient(145deg, #0a0a0a, #2a2a2a);
            border: 2px solid #444444;
            border-radius: 12px;
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.25), inset 0 0 12px rgba(255, 255, 255, 0.08), 0 6px 12px rgba(0, 0, 0, 0.7);
            padding: 12px;
            width: 100%;
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }
        .panel::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            border-radius: 12px; pointer-events: none;
        }
        h1 { 
            font-size: 12px; 
            margin: 0 0 8px 0; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: #00ffff; 
            text-shadow: 0 0 8px #00ffff; 
        }
        .buttons { display: flex; flex-direction: column; gap: 6px; }
        .button { 
            border-radius: 6px; 
            padding: 8px 12px; 
            font-size: 11px; 
            font-weight: bold; 
            color: #ffffff; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            position: relative; 
            overflow: hidden; 
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: linear-gradient(145deg, #1a1a1a, #3a3a3a);
            border: 1px solid #555;
        }
        .button:hover {
            background: linear-gradient(145deg, #2a2a2a, #4a4a4a);
            border-color: #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
        }
        .button.active {
            background: linear-gradient(145deg, #004444, #006666);
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        .back-btn {
            margin-top: 8px;
            background: #330000;
            border-color: #ff3333;
        }
        .back-btn:hover {
            background: #550000;
            border-color: #ff6666;
        }
    </style>
</head>
<body class="hidden">
    <div id="container">
        <div class="panel">
            <h1 id="title">STAGE CONTROL</h1>
            <div id="button-list" class="buttons">
                <!-- Generated via JS -->
            </div>
            <div id="controls" class="buttons hidden">
                <div class="button back-btn" onclick="goBack()">BACK</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
